# The spike-native recurrent SNN (rsnn_native.py, --arch native): raw threshold-crossing counts of the 128
# area-6v electrodes (derived/snnDataTx1, AnalysisExamples/exportRawCountsToNpz.py), one step and one
# output per 20 ms bin, no input window. Time constants are in 20 ms steps.
# Training follows the paper RNN's recipe (as speech_rsnn.yaml with --recipe rnn).
#
# Flattened into train.py's arguments; flags given explicitly win.

model:
  arch: native
  hidden_dims: [1024, 1024]
  day_input: gain          # per-channel, per-day gain on the counts (folds into the first layer's weights)
  recurrent: true
  rec_init: orthogonal
  rec_init_scale: 0.5      # weaker initial recurrent feedback over hundreds of 20 ms steps
  tbptt: 50                # truncated backpropagation, gradients cut every 50 steps (1 s): full-sentence
                           # backpropagation overflowed in nearly every update (native_sweep, first round)
  feedback: false
  neuron_type: alif
  tau_mem: 25.0            # a 500 ms leak: with at most 3 spikes per step and no leak, charge beyond what can be
                           # fired accumulated without bound (to ~16,000 thresholds in 700 steps), saturating neurons
  max_vmem: 50.0           # ceiling on the membrane potential, a safety net
  tau_adapt: 24.0          # 480 ms, as the 80 ms model's 6 steps
  adapt_scale: 1.8
  reset_type: soft
  spike_fn: max            # at most max_spikes per neuron per 20 ms step: unbounded multi-spike ran away (logits
  max_spikes: 3            # in the millions) on raw counts at 20 ms; 3 per step = up to 150 per second
  min_vmem: -1.0
  spike_thresholds: [1.0]
  tau_syn: null
  tau_syn_range: [1.0, 64.0]   # per-neuron synaptic time constants, 20 ms to 1.3 s, log-spaced, trained
  tau_lr_mult: 0.1             # ... at 0.1x the learning rate (trained at full rate, time constants diverged)
  norm_syn: true
  input_dropout: 0.2
  layer_dropout: 0.2
  out_tau_init: 2.0        # leaky output neurons, 40 ms, one trainable time constant per class
  out_tau_train: true

data:
  batch_size: 64
  white_noise_sd: 1.0      # training only, as the RNN
  constant_offset_sd: 0.2
  smooth_sd: 0.0

training:
  epochs: 48
  # the 80 ms SNN's best training (SR_strong): single-exponential surrogate, spike-rate penalty weight 30.
  # Target 0.1 spikes per neuron per 20 ms step (5 per second; the 80 ms model's best target, 0.2 per 80 ms,
  # is 2.5 per second)
  surrogate_grad: single_exponential
  spike_rate_weight: 30.0
  spike_rate_target: [0.1]
  recipe: rnn
  lr: 0.02
  weight_decay: 1.0e-5
  grad_clip: 10.0
  selection_metric: loss
  checkpoint_interval: 5

device: cuda
seed: 42
log_interval: 50
